name: Actualizar Repositório APT DCP-o-matic

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório principal
        uses: actions/checkout@v4

      - name: Preparar directório do repositório APT
        run: |
          mkdir apt-repo
          cd apt-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin gh-pages || true
          git checkout -b gh-pages origin/gh-pages || git checkout -b gh-pages

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev python3-pip gnupg curl jq
          pip3 install curl_cffi --break-system-packages

      - name: Obter a versão estável actual
        id: get_version
        run: |
          python3 -c "
          import json, urllib.request
          url = 'https://api.github.com/repos/cth103/dcpomatic/tags?per_page=50'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req).read())
          for tag in data:
              name = tag['name']
              if name.startswith('v') and '.' in name[1:]:
                  parts = name[1:].split('.')
                  if len(parts) == 3 and parts[1].isdigit() and parts[2].isdigit():
                      if int(parts[1]) % 2 == 0:
                          print(f'VERSION={name[1:]}')
                          break
          " >> $GITHUB_OUTPUT

      - name: Verificar alterações
        id: check_update
        working-directory: ./apt-repo
        run: |
          CURRENT_VERSION=""
          [ -f version.txt ] && CURRENT_VERSION=$(cat version.txt)
          NEW_VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Versão da API: '$NEW_VERSION' | Versão no repo: '$CURRENT_VERSION'"
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Descarregar pacote .deb
        if: steps.check_update.outputs.updated == 'true'
        id: download
        working-directory: ./apt-repo
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          rm -f *.deb
          python3 << 'PYEOF'
          import os, re
          from curl_cffi import requests

          version = os.environ["VERSION"]
          base = f"https://dcpomatic.com/dl?id=debian-13-x86&version={version}"
          s = requests.Session()

          s.get(base + "&paid=0", impersonate="chrome")
          s.get(base + "&paid=0", impersonate="chrome")
          r3 = s.get(base, impersonate="chrome")

          cd = r3.headers.get("content-disposition", "")
          m = re.search(r'filename="([^"]+)"', cd)
          filename = m.group(1) if m else f"dcpomatic_{version}_amd64.deb"

          with open(filename, "wb") as f:
              f.write(r3.content)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"FILENAME={filename}\n")
          PYEOF

          echo "${{ steps.get_version.outputs.VERSION }}" > version.txt

      - name: Criar Release e fazer upload do .deb
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          FILENAME: ${{ steps.download.outputs.FILENAME }}
        run: |
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "DCP-o-matic $VERSION" \
            --notes "Pacote Debian 13 (amd64) do DCP-o-matic $VERSION" \
            "$FILENAME"
          
          # Obter e guardar o URL do asset para uso posterior
          ASSET_URL=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$FILENAME\") | .url")
          echo "ASSET_URL=$ASSET_URL" >> $GITHUB_ENV
          echo "URL do asset: $ASSET_URL"

      - name: Importar chave GPG
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-keys --with-colons | awk -F: '/^pub:/ {print $5; exit}')
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
          gpg --export --armor "$GPG_KEY_ID" > dcpomatic-apt.asc

      - name: Gerar metadados APT e assinar com GPG
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        env:
          FILENAME: ${{ steps.download.outputs.FILENAME }}
        run: |
          # Criar estrutura dists/stable/main/binary-amd64
          mkdir -p dists/stable/main/binary-amd64

          # Gerar Packages com o Filename: como URL absoluto para o asset da release
          dpkg-scanpackages . /dev/null 2>/dev/null > Packages.tmp
          
          # Substituir a linha Filename: pelo URL absoluto
          # Usar Python para garantir que o URL é substituído correctamente
          python3 << PYEOF
          import re
          asset_url = "$ASSET_URL"
          with open('Packages.tmp', 'r') as f:
              content = f.read()
          
          # Substituir qualquer linha Filename: pelo URL absoluto
          content = re.sub(r'^Filename: .*$', f'Filename: {asset_url}', content, flags=re.MULTILINE)
          
          with open('dists/stable/main/binary-amd64/Packages', 'w') as f:
              f.write(content)
          PYEOF
          
          rm Packages.tmp

          gzip -9c dists/stable/main/binary-amd64/Packages \
            > dists/stable/main/binary-amd64/Packages.gz

          # Configuração do apt-ftparchive
          cat > apt-ftparchive.conf << EOF
          APT::FTPArchive::Release::Origin "DCP-o-matic APT Repository";
          APT::FTPArchive::Release::Label "DCP-o-matic";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "trixie";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          EOF

          # Gerar Release dentro de dists/stable
          cd dists/stable
          apt-ftparchive release -c=../../apt-ftparchive.conf . > Release

          # Assinar os metadados
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --detach-sign --armor -o Release.gpg Release
          cd ../..

          # Verificar o conteúdo do Packages (debugging)
          echo "=== Conteúdo do Packages ==="
          cat dists/stable/main/binary-amd64/Packages | grep -E "^(Package|Version|Filename):"
          
          # Limpar o ficheiro local
          rm -f "$FILENAME"

      - name: Limpar releases antigas
        if: steps.check_update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            | python3 -c "
          import sys, json
          releases = json.load(sys.stdin)
          releases.sort(key=lambda x: x['createdAt'], reverse=True)
          for r in releases[3:]:
              print(r['tagName'])
          " | while read TAG; do
              gh release delete "$TAG" --yes --cleanup-tag || true
          done

      - name: Commit e Push dos metadados para gh-pages
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        run: |
          git add -f dists/ dcpomatic-apt.asc version.txt
          git commit -m "Actualizar metadados para DCP-o-matic ${{ steps.get_version.outputs.VERSION }}"
          git push origin gh-pages
