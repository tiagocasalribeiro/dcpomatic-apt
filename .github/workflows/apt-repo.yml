name: Publicar Repositório APT DCP-o-matic

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev python3-pip gnupg
          pip3 install curl_cffi --break-system-packages

      - name: Obter versões stable e testing
        id: get_versions
        run: |
          python3 << 'PYEOF' >> "$GITHUB_OUTPUT"
          import re
          from curl_cffi import requests

          s = requests.Session()

          # Stable: ler a página principal de downloads
          r_stable = s.get("https://dcpomatic.com/download", impersonate="chrome")
          m_stable = re.search(r'Stable release:\s*([0-9]+\.[0-9]+\.[0-9]+)', r_stable.text)
          stable_version = m_stable.group(1) if m_stable else ""

          # Testing: ler a página de test downloads
          r_testing = s.get("https://dcpomatic.com/test-download", impersonate="chrome")
          m_testing = re.search(r'Test release:\s*([0-9]+\.[0-9]+\.[0-9]+)', r_testing.text)
          testing_version = m_testing.group(1) if m_testing else ""

          print(f"STABLE_VERSION={stable_version}")
          print(f"TESTING_VERSION={testing_version}")
          PYEOF

      - name: Criar estrutura do site APT
        run: |
          mkdir -p site/pool/stable/main/d/dcpomatic
          mkdir -p site/pool/testing/main/d/dcpomatic
          mkdir -p site/dists/stable/main/binary-amd64
          mkdir -p site/dists/testing/main/binary-amd64

      - name: Descarregar pacote stable
        env:
          VERSION: ${{ steps.get_versions.outputs.STABLE_VERSION }}
        run: |
          cd site/pool/stable/main/d/dcpomatic
          python3 << 'PYEOF'
          import os, re
          from curl_cffi import requests
          version = os.environ["VERSION"]
          base = f"https://dcpomatic.com/dl?id=debian-13-x86&version={version}"
          s = requests.Session()
          s.get(base + "&paid=0", impersonate="chrome")
          s.get(base + "&paid=0", impersonate="chrome")
          r = s.get(base, impersonate="chrome")
          cd = r.headers.get("content-disposition", "")
          m = re.search(r'filename="([^"]+)"', cd)
          filename = m.group(1) if m else f"dcpomatic_{version}_amd64.deb"
          if not r.content.startswith(b"!<arch>"):
              raise SystemExit("ERRO: ficheiro não é um .deb válido")
          with open(filename, "wb") as f: f.write(r.content)
          print(f"[stable] {filename} ({len(r.content)} bytes)")
          PYEOF

      - name: Descarregar pacote testing
        env:
          VERSION: ${{ steps.get_versions.outputs.TESTING_VERSION }}
        run: |
          cd site/pool/testing/main/d/dcpomatic
          python3 << 'PYEOF'
          import os, re
          from curl_cffi import requests
          version = os.environ["VERSION"]
          base = f"https://dcpomatic.com/dl?id=debian-13-x86&version={version}"
          s = requests.Session()
          s.get(base + "&paid=0", impersonate="chrome")
          s.get(base + "&paid=0", impersonate="chrome")
          r = s.get(base, impersonate="chrome")
          cd = r.headers.get("content-disposition", "")
          m = re.search(r'filename="([^"]+)"', cd)
          filename = m.group(1) if m else f"dcpomatic_{version}_amd64.deb"
          if not r.content.startswith(b"!<arch>"):
              raise SystemExit("ERRO: ficheiro não é um .deb válido")
          with open(filename, "wb") as f: f.write(r.content)
          print(f"[testing] {filename} ({len(r.content)} bytes)")
          PYEOF

      - name: Importar chave GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --list-keys --with-colons | awk -F: '/^pub:/ {print $5; exit}')"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          gpg --export --armor "$GPG_KEY_ID" > site/dcpomatic-apt.asc

      - name: Gerar metadados APT stable
        env:
          VERSION: ${{ steps.get_versions.outputs.STABLE_VERSION }}
        run: |
          cd site
          echo "$VERSION" > stable-version.txt

          dpkg-scanpackages pool/stable /dev/null 2>/dev/null \
            > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages \
            > dists/stable/main/binary-amd64/Packages.gz

          cat > /tmp/ftp-stable.conf << EOF
          APT::FTPArchive::Release::Origin "DCP-o-matic APT Repository";
          APT::FTPArchive::Release::Label "DCP-o-matic";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "trixie";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          EOF

          cd dists/stable
          apt-ftparchive release -c=/tmp/ftp-stable.conf . > Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --detach-sign --armor -o Release.gpg Release

      - name: Gerar metadados APT testing
        env:
          VERSION: ${{ steps.get_versions.outputs.TESTING_VERSION }}
        run: |
          cd site
          echo "$VERSION" > testing-version.txt

          dpkg-scanpackages pool/testing /dev/null 2>/dev/null \
            > dists/testing/main/binary-amd64/Packages
          gzip -9c dists/testing/main/binary-amd64/Packages \
            > dists/testing/main/binary-amd64/Packages.gz

          cat > /tmp/ftp-testing.conf << EOF
          APT::FTPArchive::Release::Origin "DCP-o-matic APT Repository";
          APT::FTPArchive::Release::Label "DCP-o-matic";
          APT::FTPArchive::Release::Suite "testing";
          APT::FTPArchive::Release::Codename "trixie";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          EOF

          cd dists/testing
          apt-ftparchive release -c=/tmp/ftp-testing.conf . > Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --detach-sign --armor -o Release.gpg Release

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4
