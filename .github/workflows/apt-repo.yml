name: Actualizar Repositório APT DCP-o-matic

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório principal
        uses: actions/checkout@v4

      - name: Preparar directório do repositório APT
        run: |
          mkdir apt-repo
          cd apt-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin gh-pages || true
          git checkout -b gh-pages origin/gh-pages || git checkout -b gh-pages

      - name: Instalar ferramentas APT
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev python3-pip

      - name: Instalar curl_cffi
        run: pip3 install curl_cffi --break-system-packages

      - name: Obter a versão estável actual
        id: get_version
        run: |
          python3 -c "
          import json, urllib.request
          url = 'https://api.github.com/repos/cth103/dcpomatic/tags?per_page=50'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req).read())
          for tag in data:
              name = tag['name']
              if name.startswith('v') and '.' in name[1:]:
                  parts = name[1:].split('.')
                  if len(parts) == 3 and parts[1].isdigit() and parts[2].isdigit():
                      if int(parts[1]) % 2 == 0:
                          print(f'VERSION={name[1:]}')
                          break
          " >> $GITHUB_OUTPUT

      - name: Verificar alterações
        id: check_update
        working-directory: ./apt-repo
        run: |
          CURRENT_VERSION=""
          [ -f version.txt ] && CURRENT_VERSION=$(cat version.txt)
          NEW_VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Versão da API: '$NEW_VERSION' | Versão no repo: '$CURRENT_VERSION'"
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Descarregar pacote .deb
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          rm -f *.deb
          python3 << 'PYEOF'
          import os, re
          from curl_cffi import requests

          version = os.environ["VERSION"]
          base = f"https://dcpomatic.com/dl?id=debian-13-x86&version={version}"
          s = requests.Session()

          # Passo 1: página de doação (obtém cookie PHPSESSID)
          print("Passo 1: a obter cookie de sessão...")
          s.get(base + "&paid=0", impersonate="chrome")

          # Passo 2: "Your download should start soon"
          print("Passo 2: a passar pela página de doação...")
          r2 = s.get(base + "&paid=0", impersonate="chrome")

          # Passo 3: download real (URL sem paid)
          print("Passo 3: a descarregar o .deb...")
          r3 = s.get(base, impersonate="chrome")

          # Extrair nome do ficheiro do Content-Disposition
          cd = r3.headers.get("content-disposition", "")
          m = re.search(r'filename="([^"]+)"', cd)
          filename = m.group(1) if m else f"dcpomatic_{version}_amd64.deb"

          with open(filename, "wb") as f:
              f.write(r3.content)
          print(f"Guardado: {filename} ({len(r3.content)} bytes)")
          PYEOF

          echo "${{ steps.get_version.outputs.VERSION }}" > version.txt
          ls -lh *.deb

      - name: Gerar metadados APT
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        run: |
          dpkg-scanpackages . /dev/null > Packages
          gzip -9c Packages > Packages.gz
          apt-ftparchive release . > Release

      - name: Commit e Push para gh-pages
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        run: |
          git add -f *.deb Packages Packages.gz Release version.txt
          git commit -m "Actualizar DCP-o-matic para ${{ steps.get_version.outputs.VERSION }}"
          git push origin gh-pages
