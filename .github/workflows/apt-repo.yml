name: Actualizar Repositório APT DCP-o-matic

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório principal
        uses: actions/checkout@v4

      - name: Preparar directório do repositório APT
        run: |
          mkdir apt-repo
          cd apt-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin gh-pages || true
          git checkout -b gh-pages origin/gh-pages || git checkout -b gh-pages

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev python3-pip
          pip3 install curl_cffi --break-system-packages

      - name: Obter a versão estável actual
        id: get_version
        run: |
          python3 -c "
          import json, urllib.request
          url = 'https://api.github.com/repos/cth103/dcpomatic/tags?per_page=50'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req).read())
          for tag in data:
              name = tag['name']
              if name.startswith('v') and '.' in name[1:]:
                  parts = name[1:].split('.')
                  if len(parts) == 3 and parts[1].isdigit() and parts[2].isdigit():
                      if int(parts[1]) % 2 == 0:
                          print(f'VERSION={name[1:]}')
                          break
          " >> $GITHUB_OUTPUT

      - name: Verificar alterações
        id: check_update
        working-directory: ./apt-repo
        run: |
          CURRENT_VERSION=""
          [ -f version.txt ] && CURRENT_VERSION=$(cat version.txt)
          NEW_VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Versão da API: '$NEW_VERSION' | Versão no repo: '$CURRENT_VERSION'"
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Descarregar pacote .deb
        if: steps.check_update.outputs.updated == 'true'
        id: download
        working-directory: ./apt-repo
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          rm -f *.deb
          python3 << 'PYEOF'
          import os, re
          from curl_cffi import requests

          version = os.environ["VERSION"]
          base = f"https://dcpomatic.com/dl?id=debian-13-x86&version={version}"
          s = requests.Session()

          print("Passo 1: a obter cookie de sessão...")
          s.get(base + "&paid=0", impersonate="chrome")

          print("Passo 2: a passar pela página de doação...")
          s.get(base + "&paid=0", impersonate="chrome")

          print("Passo 3: a descarregar o .deb...")
          r3 = s.get(base, impersonate="chrome")

          cd = r3.headers.get("content-disposition", "")
          m = re.search(r'filename="([^"]+)"', cd)
          filename = m.group(1) if m else f"dcpomatic_{version}_amd64.deb"

          with open(filename, "wb") as f:
              f.write(r3.content)
          print(f"Guardado: {filename} ({len(r3.content)} bytes)")

          # Exportar nome do ficheiro para os próximos passos
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"FILENAME={filename}\n")
          PYEOF

          echo "${{ steps.get_version.outputs.VERSION }}" > version.txt

      - name: Criar Release e fazer upload do .deb
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          FILENAME: ${{ steps.download.outputs.FILENAME }}
        run: |
          TAG="v${VERSION}"

          # Apagar release existente se houver (para permitir re-execuções)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # Criar release e fazer upload do asset
          gh release create "$TAG" \
            --title "DCP-o-matic $VERSION" \
            --notes "Pacote Debian 13 (amd64) do DCP-o-matic $VERSION, obtido automaticamente de dcpomatic.com" \
            "$FILENAME"

          # Verificar se o upload foi bem sucedido
          echo "Asset URL:"
          gh release view "$TAG" --json assets --jq '.assets[].url'

      - name: Gerar metadados APT com URLs absolutos
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          FILENAME: ${{ steps.download.outputs.FILENAME }}
        run: |
          # Obter URL de download do asset da release
          TAG="v${VERSION}"
          ASSET_URL=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$FILENAME\") | .url")

          if [ -z "$ASSET_URL" ]; then
            echo "ERRO: não foi possível obter URL do asset"
            exit 1
          fi

          echo "URL do asset: $ASSET_URL"

          # Gerar Packages e substituir o Filename: pelo URL absoluto
          dpkg-scanpackages . /dev/null 2>/dev/null > Packages.raw

          # Substituir a linha Filename: pelo URL absoluto
          sed "s|^Filename: \./.*|Filename: ${ASSET_URL}|" Packages.raw > Packages
          rm Packages.raw

          # Gerar Packages.gz e Release
          gzip -9c Packages > Packages.gz
          apt-ftparchive release . > Release

          # Remover o .deb do directório (não fazemos commit dele para o gh-pages)
          rm -f "$FILENAME"

          echo "=== Packages ==="
          cat Packages
          echo ""
          ls -lh

      - name: Limpar releases antigas
        if: steps.check_update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Manter apenas as 3 releases mais recentes
          gh release list --limit 100 --json tagName,createdAt \
            | python3 -c "
          import sys, json
          releases = json.load(sys.stdin)
          releases.sort(key=lambda x: x['createdAt'], reverse=True)
          for r in releases[3:]:
              print(r['tagName'])
          " | while read TAG; do
              echo "A apagar release antiga: $TAG"
              gh release delete "$TAG" --yes --cleanup-tag || true
          done

      - name: Commit e Push dos metadados para gh-pages
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        run: |
          git add -f Packages Packages.gz Release version.txt
          git commit -m "Actualizar metadados para DCP-o-matic ${{ steps.get_version.outputs.VERSION }}"
          git push origin gh-pages
