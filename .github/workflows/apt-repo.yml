name: Publicar Repositório APT DCP-o-matic

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forçar publicação mesmo que a versão seja igual'
        required: false
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev python3-pip gnupg
          pip3 install curl_cffi --break-system-packages

      - name: Obter versão estável actual
        id: get_version
        run: |
          python3 << 'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import urllib.request

          url = "https://api.github.com/repos/cth103/dcpomatic/tags?per_page=50"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          data = json.loads(urllib.request.urlopen(req).read())

          for tag in data:
              name = tag["name"]

              if not name.startswith("v"):
                  continue

              version = name[1:]
              parts = version.split(".")

              if len(parts) != 3:
                  continue

              major, minor, patch = parts

              if not major.isdigit() or not minor.isdigit() or not patch.isdigit():
                  continue

              # No DCP-o-matic, versões com minor par são estáveis.
              if int(minor) % 2 == 0:
                  print(f"VERSION={version}")
                  break
          PYEOF

      - name: Verificar versão actualmente publicada
        id: check_update
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.VERSION }}
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
        run: |
          echo "Nova versão detectada: $NEW_VERSION"

          CURRENT_VERSION="$(curl -fsSL https://tiagocasalribeiro.github.io/dcpomatic-apt/version.txt || true)"

          echo "Versão publicada actualmente: '$CURRENT_VERSION'"
          echo "Forçar publicação: '$FORCE_DEPLOY'"

          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "Forçado manualmente."
            echo "updated=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$CURRENT_VERSION" ]; then
            echo "Ainda não há versão publicada."
            echo "updated=true" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "Há nova versão."
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sem alterações."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar estrutura do site APT
        if: steps.check_update.outputs.updated == 'true'
        run: |
          mkdir -p site/pool/main/d/dcpomatic
          mkdir -p site/dists/stable/main/binary-amd64

      - name: Descarregar pacote .deb
        if: steps.check_update.outputs.updated == 'true'
        id: download
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          cd site/pool/main/d/dcpomatic

          python3 << 'PYEOF'
          import os
          import re
          from curl_cffi import requests

          version = os.environ["VERSION"]
          base = f"https://dcpomatic.com/dl?id=debian-13-x86&version={version}"

          s = requests.Session()

          print("Passo 1: obter cookie de sessão...")
          s.get(base + "&paid=0", impersonate="chrome")

          print("Passo 2: passar pela página de doação...")
          s.get(base + "&paid=0", impersonate="chrome")

          print("Passo 3: descarregar o pacote real...")
          r = s.get(base, impersonate="chrome")

          cd = r.headers.get("content-disposition", "")
          m = re.search(r'filename="([^"]+)"', cd)
          filename = m.group(1) if m else f"dcpomatic_{version}_amd64.deb"

          if not r.content.startswith(b"!<arch>"):
              raise SystemExit("ERRO: o ficheiro descarregado não é um pacote Debian válido")

          with open(filename, "wb") as f:
              f.write(r.content)

          print(f"Ficheiro guardado: {filename}")
          print(f"Tamanho: {len(r.content)} bytes")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"FILENAME={filename}\n")
          PYEOF

      - name: Importar chave GPG
        if: steps.check_update.outputs.updated == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "ERRO: segredo GPG_PRIVATE_KEY não definido."
            exit 1
          fi

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          GPG_KEY_ID="$(gpg --list-keys --with-colons | awk -F: '/^pub:/ {print $5; exit}')"

          if [ -z "$GPG_KEY_ID" ]; then
            echo "ERRO: não foi possível obter o ID da chave GPG."
            exit 1
          fi

          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"

          gpg --export --armor "$GPG_KEY_ID" > site/dcpomatic-apt.asc

      - name: Gerar metadados APT
        if: steps.check_update.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          cd site

          echo "$VERSION" > version.txt

          dpkg-scanpackages pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz

          cat > apt-ftparchive.conf << EOF
          APT::FTPArchive::Release::Origin "DCP-o-matic APT Repository";
          APT::FTPArchive::Release::Label "DCP-o-matic";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "trixie";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          EOF

          cd dists/stable
          apt-ftparchive release -c=../../apt-ftparchive.conf . > Release

          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --detach-sign --armor -o Release.gpg Release

          cd ../..

          echo "=== Packages ==="
          grep -E "^(Package|Version|Architecture|Filename|Size|SHA256):" dists/stable/main/binary-amd64/Packages

          echo ""
          echo "=== Estrutura final ==="
          find . -type f -maxdepth 6 -printf '%p %s bytes\n'

      - name: Configurar GitHub Pages
        if: steps.check_update.outputs.updated == 'true'
        uses: actions/configure-pages@v5

      - name: Upload do artifact do GitHub Pages
        if: steps.check_update.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
