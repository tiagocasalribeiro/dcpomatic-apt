name: Actualizar Repositório APT DCP-o-matic

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório principal
        uses: actions/checkout@v4

      - name: Preparar directório do repositório APT
        run: |
          mkdir apt-repo
          cd apt-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin gh-pages || true
          git checkout -b gh-pages origin/gh-pages || git checkout -b gh-pages

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev python3-pip gnupg curl
          pip3 install curl_cffi --break-system-packages

      - name: Obter a versão estável actual
        id: get_version
        run: |
          python3 -c "
          import json, urllib.request
          url = 'https://api.github.com/repos/cth103/dcpomatic/tags?per_page=50'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req).read())
          for tag in data:
              name = tag['name']
              if name.startswith('v') and '.' in name[1:]:
                  parts = name[1:].split('.')
                  if len(parts) == 3 and parts[1].isdigit() and parts[2].isdigit():
                      if int(parts[1]) % 2 == 0:
                          print(f'VERSION={name[1:]}')
                          break
          " >> $GITHUB_OUTPUT

      - name: Verificar alterações
        id: check_update
        working-directory: ./apt-repo
        run: |
          CURRENT_VERSION=""
          [ -f version.txt ] && CURRENT_VERSION=$(cat version.txt)
          NEW_VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Versão da API: '$NEW_VERSION' | Versão no repo: '$CURRENT_VERSION'"
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Descarregar pacote .deb
        if: steps.check_update.outputs.updated == 'true'
        id: download
        working-directory: ./apt-repo
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          rm -f *.deb
          python3 << 'PYEOF'
          import os, re
          from curl_cffi import requests

          version = os.environ["VERSION"]
          base = f"https://dcpomatic.com/dl?id=debian-13-x86&version={version}"
          s = requests.Session()

          s.get(base + "&paid=0", impersonate="chrome")
          s.get(base + "&paid=0", impersonate="chrome")
          r3 = s.get(base, impersonate="chrome")

          cd = r3.headers.get("content-disposition", "")
          m = re.search(r'filename="([^"]+)"', cd)
          filename = m.group(1) if m else f"dcpomatic_{version}_amd64.deb"

          with open(filename, "wb") as f:
              f.write(r3.content)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"FILENAME={filename}\n")
          PYEOF

          echo "${{ steps.get_version.outputs.VERSION }}" > version.txt

      - name: Importar chave GPG
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-keys --with-colons | awk -F: '/^pub:/ {print $5; exit}')
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
          gpg --export --armor "$GPG_KEY_ID" > dcpomatic-apt.asc

      - name: Fazer upload do .deb para gh-pages via GitHub API
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILENAME: ${{ steps.download.outputs.FILENAME }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          
          # Obter a SHA do último commit do gh-pages
          LAST_COMMIT_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/git/ref/heads/gh-pages" \
            | jq -r '.object.sha')
          
          # Obter a SHA da tree do último commit
          LAST_TREE_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/git/commits/$LAST_COMMIT_SHA" \
            | jq -r '.tree.sha')
          
          # Fazer upload do .deb como blob (suporta ficheiros grandes via API)
          echo "A fazer upload de $FILENAME via GitHub API..."
          FILE_SHA=$(curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/git/blobs" \
            -d "$(python3 -c "
          import json, base64
          with open('$FILENAME', 'rb') as f:
              data = base64.b64encode(f.read()).decode()
          print(json.dumps({'content': data, 'encoding': 'base64'}))
          ")" | jq -r '.sha')
          
          echo "Blob SHA: $FILE_SHA"
          
          # Criar nova tree com o ficheiro .deb na raiz
          NEW_TREE_SHA=$(curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/git/trees" \
            -d "$(cat <<EOF
          {
            "base_tree": "$LAST_TREE_SHA",
            "tree": [
              {
                "path": "$FILENAME",
                "mode": "100644",
                "type": "blob",
                "sha": "$FILE_SHA"
              }
            ]
          }
          EOF
          )" | jq -r '.sha')
          
          echo "Nova tree SHA: $NEW_TREE_SHA"
          
          # Criar novo commit
          NEW_COMMIT_SHA=$(curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/git/commits" \
            -d "$(cat <<EOF
          {
            "message": "Adicionar $FILENAME",
            "tree": "$NEW_TREE_SHA",
            "parents": ["$LAST_COMMIT_SHA"]
          }
          EOF
          )" | jq -r '.sha')
          
          echo "Novo commit SHA: $NEW_COMMIT_SHA"
          
          # Actualizar a referência gh-pages para o novo commit
          curl -s -X PATCH -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/git/refs/heads/gh-pages" \
            -d "{\"sha\": \"$NEW_COMMIT_SHA\"}"
          
          echo "Upload concluído com sucesso!"
          
          # Limpar o ficheiro local (não vamos fazer commit via git)
          rm -f "$FILENAME"

      - name: Gerar metadados APT e assinar com GPG
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        env:
          FILENAME: ${{ steps.download.outputs.FILENAME }}
        run: |
          # Criar estrutura dists/stable/main/binary-amd64
          mkdir -p dists/stable/main/binary-amd64

          # Gerar Packages com o Filename: como caminho relativo
          dpkg-scanpackages . /dev/null 2>/dev/null \
            | sed "s|^Filename: \./.*|Filename: $FILENAME|" \
            > dists/stable/main/binary-amd64/Packages

          gzip -9c dists/stable/main/binary-amd64/Packages \
            > dists/stable/main/binary-amd64/Packages.gz

          # Configuração do apt-ftparchive
          cat > apt-ftparchive.conf << EOF
          APT::FTPArchive::Release::Origin "DCP-o-matic APT Repository";
          APT::FTPArchive::Release::Label "DCP-o-matic";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "trixie";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          EOF

          # Gerar Release dentro de dists/stable
          cd dists/stable
          apt-ftparchive release -c=../../apt-ftparchive.conf . > Release

          # Assinar os metadados
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --detach-sign --armor -o Release.gpg Release
          cd ../..

      - name: Limpar releases antigas
        if: steps.check_update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            | python3 -c "
          import sys, json
          releases = json.load(sys.stdin)
          releases.sort(key=lambda x: x['createdAt'], reverse=True)
          for r in releases[3:]:
              print(r['tagName'])
          " | while read TAG; do
              gh release delete "$TAG" --yes --cleanup-tag || true
          done

      - name: Commit e Push dos metadados para gh-pages
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        run: |
          git add -f dists/ dcpomatic-apt.asc version.txt
          git commit -m "Actualizar metadados para DCP-o-matic ${{ steps.get_version.outputs.VERSION }}"
          git push origin gh-pages
