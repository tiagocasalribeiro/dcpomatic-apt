name: Actualizar Repositório APT DCP-o-matic

on:
  schedule:
    - cron: '0 0 * * *' # Corre diariamente à meia-noite
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório principal
        uses: actions/checkout@v4

      - name: Preparar directório do repositório APT
        run: |
          mkdir apt-repo
          cd apt-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin gh-pages || true
          git checkout -b gh-pages origin/gh-pages || git checkout -b gh-pages

      - name: Instalar ferramentas APT e Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev nodejs npm

      - name: Obter a versão actual via GitHub API
        id: get_version
        run: |
          python3 -c "
          import json, urllib.request
          url = 'https://api.github.com/repos/cth103/dcpomatic/tags?per_page=50'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req).read())
          for tag in data:
              name = tag['name']
              if name.startswith('v') and '.' in name[1:]:
                  parts = name[1:].split('.')
                  if len(parts) == 3 and parts[1].isdigit() and parts[2].isdigit():
                      minor = int(parts[1])
                      if minor % 2 == 0:
                          print(f'VERSION={name[1:]}')
                          break
          " >> $GITHUB_OUTPUT

      - name: Verificar alterações
        id: check_update
        working-directory: ./apt-repo
        run: |
          CURRENT_VERSION=""
          if [ -f version.txt ]; then
            CURRENT_VERSION=$(cat version.txt)
          fi
          
          NEW_VERSION="${{ steps.get_version.outputs.VERSION }}"
          
          echo "Versão actual (da API): '$NEW_VERSION'"
          echo "Versão no repositório: '$CURRENT_VERSION'"
          
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Primeira execução - forçar actualização"
            echo "updated=true" >> $GITHUB_OUTPUT
          elif [ "$CURRENT_VERSION" == "$NEW_VERSION" ]; then
            echo "Sem alterações na versão."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "Nova versão detectada!"
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Instalar Playwright
        if: steps.check_update.outputs.updated == 'true'
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Descarregar pacote .deb com Playwright
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          cat > download.js << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-blink-features=AutomationControlled',
                '--disable-features=IsolateOrigins,site-per-process'
              ]
            });
            
            const context = await browser.newContext({
              acceptDownloads: true,
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              viewport: { width: 1920, height: 1080 }
            });
            
            const page = await context.newPage();
            
            const version = process.env.VERSION;
            const url = `https://dcpomatic.com/dl?id=debian-13-x86&version=${version}&paid=0`;
            
            console.log(`A abrir ${url}...`);
            
            // Usar 'load' em vez de 'networkidle' para evitar timeout com Cloudflare
            await page.goto(url, { waitUntil: 'load', timeout: 120000 });
            
            console.log('Página carregada, à espera do botão...');
            
            // Esperar pelo botão "Just let me download it"
            const downloadLink = page.getByText('Just let me download it');
            await downloadLink.waitFor({ state: 'visible', timeout: 60000 });
            
            console.log('Botão encontrado, a clicar...');
            
            const [download] = await Promise.all([
              page.waitForEvent('download', { timeout: 120000 }),
              downloadLink.click()
            ]);
            
            const filename = `dcpomatic_${version}_amd64.deb`;
            await download.saveAs(filename);
            console.log(`Ficheiro guardado como ${filename}`);
            console.log(`Tamanho: ${(await download.path()).stat?.size || 'desconhecido'} bytes`);
            
            await browser.close();
            console.log('Download concluído com sucesso');
          })();
          EOF
          
          node download.js
          rm download.js
          
          echo "${{ steps.get_version.outputs.VERSION }}" > version.txt
          ls -lh *.deb

      - name: Gerar metadados APT
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        run: |
          dpkg-scanpackages . /dev/null > Packages
          gzip -9c Packages > Packages.gz
          apt-ftparchive release . > Release
          ls -lh

      - name: Commit e Push para gh-pages
        if: steps.check_update.outputs.updated == 'true'
        working-directory: ./apt-repo
        run: |
          git add -f *.deb Packages Packages.gz Release version.txt
          git commit -m "Actualizar DCP-o-matic para a versão ${{ steps.get_version.outputs.VERSION }}" || echo "Sem alterações para commit"
          git push origin gh-pages
